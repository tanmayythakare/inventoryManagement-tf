<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">📦</div>
      <h2>Inventory Platform</h2>
      <p class="subtitle">Cloud DevOps Three-Tier Workload</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          id="username"
          type="text"
          class="form-control"
          formControlName="username"
          placeholder="admin@example.com"
        />
        <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="text-danger">
          Username is required
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="••••••••"
        />
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger">
          Password is required
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="isLoading">Authenticating...</span>
        <span *ngIf="!isLoading">Sign In</span>
      </button>
    </form>

    <div class="demo-credentials">
      <p><strong>Demo Credentials:</strong></p>
      <p>Admin: <code>admin&#64;example.com</code> / <code>AdminPassword123!</code></p>
      <p>User: <code>user&#64;example.com</code> / <code>User123!</code></p>
    </div>
  </div>
</div>
